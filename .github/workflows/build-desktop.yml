name: Build CIEE Hub Desktop

on:
  push:
    branches:
      - feature/hub-desktop-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore desktop/CieeHub.Desktop/CieeHub.Desktop.csproj

      - name: Publish win-x64
        run: dotnet publish desktop/CieeHub.Desktop/CieeHub.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CIEE-Hub-Desktop-win-x64
          path: publish/win-x64/**
          if-no-files-found: error
