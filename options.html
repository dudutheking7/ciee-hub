<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - CIEE Hub PRO</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }
        h1 { color: #60a5fa; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        h3 { color: #cbd5e1; margin-bottom: 10px; margin-top: 30px;}
        
        .config-group { margin-bottom: 20px; }
        label { display: flex; align-items: center; cursor: pointer; margin-bottom: 10px; font-size: 14px;}
        input[type="checkbox"] { margin-right: 10px; width: 16px; height: 16px; cursor: pointer; }
        
        /* Slider de Tamanho */
        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type="range"] { flex: 1; }
        #zoom_value { font-weight: bold; color: #4ade80; }

        .btn-salvar {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: 0.2s;
        }
        .btn-salvar:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        #status { color: #4ade80; text-align: center; margin-top: 15px; font-weight: bold; opacity: 0; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ CIEE Hub PRO - Configurações</h1>
        
        <div class="config-group">
            <h3>🎨 Aparência do Mod Menu</h3>
            <label>Tamanho (Zoom) do Menu Kairós:</label>
            <div class="slider-container">
                <input type="range" id="menu_scale" min="80" max="150" value="100">
                <span id="zoom_value">100%</span>
            </div>
            <small style="color: #94a3b8; display: block; margin-top: 5px;">Se o menu ficar muito grande na sua tela, diminua o zoom.</small>
        </div>

        <div class="config-group">
            <h3>🔘 Personalização de Botões (Kairós)</h3>
            <small style="color: #94a3b8; display: block; margin-bottom: 15px;">Desmarque as funções que você não usa para limpar o menu.</small>
            
            <label><input type="checkbox" id="btn_etapa" checked> Mostrar "Criar Etapa Completa"</label>
            <label><input type="checkbox" id="btn_inj_padrao" checked> Mostrar "Injetar Contato (Padrão)"</label>
            <label><input type="checkbox" id="btn_log" checked> Mostrar "Colar Log (+7 Dias)"</label>
            <label><input type="checkbox" id="btn_cv" checked> Mostrar "Robô Baixar CVs"</label>
            <label><input type="checkbox" id="btn_csv" checked> Mostrar "Extrair Contatos (CSV)"</label>
            <label><input type="checkbox" id="btn_antilag" checked> Mostrar "Anti-Lag"</label>
        </div>

        <button class="btn-salvar" id="salvar_btn">💾 Salvar Preferências</button>
        <div id="status">Configurações salvas com sucesso!</div>
    </div>

    <!-- Script de controle da página -->
    <script src="js/options.js"></script>
</body>
</html>
