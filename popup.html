<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <main class="popup-shell" aria-label="CIEE Hub launcher">
        <header class="popup-header">
            <div class="brand">
                <span class="brand-mark">⚡</span>
                <div>
                    <h1>CIEE Hub</h1>
                    <p class="small">Launcher operacional</p>
                </div>
            </div>
            <span class="version-pill">v4.0</span>
        </header>

        <button id="btn_abrir_hub" class="btn-primary">🖥️ Abrir Painel Principal</button>

        <div class="section-title">Ações rápidas</div>
        <section class="quick-grid" aria-label="Leitores de tela">
            <button id="btn_enviar_dados" class="quick-btn btn-scan"><span>🎯</span>Escanear Zendesk</button>
            <button id="btn_airtable" class="quick-btn btn-airtable"><span>🟣</span>Escanear Airtable</button>
        </section>

        <div id="status" role="status">Pronto para iniciar.</div>
        <p class="popup-note">Dica: abra o painel primeiro e use o launcher para enviar dados da aba ativa para o Hub.</p>
    </main>

    <script src="popup.js"></script>
</body>
</html>
